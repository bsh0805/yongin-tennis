<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12181f" />
<title>용인 테니스 빈 코트</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">

  <header class="header">
    <div class="header-title">
      <span class="ball-dot" aria-hidden="true"></span>
      <h1>용인 테니스 빈 코트</h1>
    </div>
    <p class="header-sub">공공체육시설 테니스장의 빈 시간을 날짜·코트별로 모아 봅니다. 예약은 용인 공고 페이지로 이동해서 진행하세요.</p>
  </header>

  <section class="panel" id="controls">
    <div class="field">
      <label for="date-input">날짜</label>
      <input type="date" id="date-input" />
    </div>

    <div class="field">
      <label for="gu-select">지역</label>
      <select id="gu-select"></select>
    </div>

    <div class="field field-checkbox">
      <label class="checkbox-label">
        <input type="checkbox" id="favorites-only" />
        <span>관심 코트만 조회 (<span id="favorites-count">0</span>곳)</span>
      </label>
    </div>

    <div id="scope-line" class="scope-line"></div>

    <div id="threshold-warning" class="warning hidden">
      <p><strong id="threshold-count"></strong>곳을 한 번에 조회하면 용인 서버 레이트 리밋(약 25~30건)에 걸릴 수 있습니다. 지역이나 관심 코트로 범위를 좁히는 걸 권장합니다.</p>
      <button id="warning-proceed" class="btn btn-secondary">그래도 조회</button>
    </div>

    <button id="search-btn" class="btn btn-primary">조회</button>
  </section>

  <section id="progress-section" class="panel hidden">
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    <p id="progress-text" class="progress-text"></p>
  </section>

  <section id="blocked-banner" class="banner banner-blocked hidden">
    <p id="blocked-text"></p>
  </section>

  <section id="summary" class="summary hidden">
    <div class="summary-stat"><span id="stat-free-courts" class="summary-num">0</span><span class="summary-label">빈 코트</span></div>
    <div class="summary-stat"><span id="stat-free-slots" class="summary-num">0</span><span class="summary-label">빈 시간대</span></div>
    <div class="summary-stat"><span id="stat-checked" class="summary-num">0</span><span class="summary-label">조회된 코트</span></div>
  </section>

  <section id="results-controls" class="results-controls hidden">
    <div class="tabs">
      <button class="tab-btn active" data-tab="time">시간대별</button>
      <button class="tab-btn" data-tab="court">코트별</button>
    </div>
    <label class="checkbox-label small">
      <input type="checkbox" id="free-only" checked />
      <span>빈자리만 보기</span>
    </label>
  </section>

  <section id="view-time" class="results-view"></section>
  <section id="view-court" class="results-view hidden"></section>

  <p id="empty-hint" class="empty-hint">날짜와 지역을 고르고 조회를 눌러주세요.</p>

  <footer class="footer">
    <p>데이터는 용인시 공공체육시설 예약 시스템에서 가져옵니다. 서버 부하를 줄이기 위해 60초간 캐시되며, 요청이 몰리면 자동으로 속도를 늦춥니다.</p>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
